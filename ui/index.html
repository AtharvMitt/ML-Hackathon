<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathSnap · Route reconstruction</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff2ef;color:#19342c;font:16px "Inter",system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:4vh 4vw}header{display:flex;align-items:baseline;gap:1em}h1{letter-spacing:-.06em;font-size:clamp(32px,5vw,64px);margin:.25em 0}form,section{background:white;border:1px solid #cad6ce;padding:18px;border-radius:8px}form{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:1em 0}label{display:grid;gap:6px}button,input,select{padding:.65em;border:1px solid #9eb3a8;border-radius:4px;font:inherit}button{background:#185d46;color:white;cursor:pointer}button:disabled{opacity:.5}canvas{display:block;width:100%;height:55vh;background:#f5f6ef}p{margin:.8em 0}.gps{color:#735196}.route{color:#17764d}output{display:block;font-variant-numeric:tabular-nums}
.layers{display:flex;gap:1em;align-items:center;flex-wrap:wrap;margin:.8em 0}.layers label{display:inline-flex;align-items:center;gap:.35em;cursor:pointer}.line-key{width:1.6em;border-top:4px solid #17764d}.line-key.reference{border-top:3px dashed #c6530a}.layers small{color:#52645d}
</style><main><header><h1>PathSnap</h1><span>Route reconstruction</span></header>
<form id="controls"><label>API address<input id="host" type="url" required></label><button type="button" id="connect">Load trips</button>
<label>Trip<select id="trips" disabled></select></label><button id="run" disabled>Reconstruct route</button></form>
<section><output id="status" aria-live="polite">Connect to the API on Laptop 1.</output><div class="layers" role="group" aria-label="Map layers">
<label><input id="predicted-layer" type="checkbox" checked disabled><span class="line-key" aria-hidden="true"></span>Predicted route</label>
<label><input id="reference-layer" type="checkbox" checked disabled><span class="line-key reference" aria-hidden="true"></span>Reference route</label>
<small id="reference-status"></small><label><input id="gps-layer" type="checkbox" checked disabled><span class="gps" aria-hidden="true">●</span>GPS observations</label><span style="color:#68747d">━ Road network</span>
</div><canvas aria-label="Map of the selected trip and predicted route"></canvas></section></main>
<script>
const el=id=>document.getElementById(id),host=el('host'),trips=el('trips'),run=el('run'),statusLine=el('status');
host.value=new URLSearchParams(location.search).get('api') || localStorage.getItem('api') || ('http://'+(location.hostname||'localhost')+':8000');
let data,version=0;
const predictedLayer = el('predicted-layer'), referenceLayer = el('reference-layer'), gpsLayer = el('gps-layer');
predictedLayer.onchange = referenceLayer.onchange = gpsLayer.onchange = draw;
const base=()=>host.value.trim().replace(/\/$/,'');
function reset(){version++;data=null;draw();trips.replaceChildren();trips.disabled=run.disabled=true;}
host.oninput=reset;
el('connect').onclick=async()=>{reset();const v=version;try{
const r=await fetch(base()+'/trips');if(!r.ok)throw Error('Trip list unavailable');
const list=await r.json();if(v!==version)return;
list.forEach(t=>trips.add(new Option(t,t)));localStorage.setItem('api',base());
trips.disabled=run.disabled=!list.length;statusLine.value=list.length+' trips available.';
}catch(e){if(v===version)statusLine.value=e.message;}};
trips.onchange=()=>{version++;data=null;draw();run.disabled=false;statusLine.value='Ready.';};
el('controls').onsubmit=async e=>{e.preventDefault();const v=++version;run.disabled=true;data=null;draw();statusLine.value='Reconstructing…';
try{const r=await fetch(base()+'/predict/'+encodeURIComponent(trips.value),{method:'POST'});if(!r.ok)throw Error('Prediction failed ('+r.status+')');
const next=await r.json();if(v!==version)return;data=next;draw();
statusLine.value='Trip '+data.trip+' · '+data.track.length+' observations · '+data.route.length+' route fragments · '+data.elapsed_seconds.toFixed(2)+' s'+(data.metrics?' · Top-1 '+(100*data.metrics.top1).toFixed(2)+'%':'')+(data.road_network?'':' · Road layer unavailable. Restart the updated API.');
}catch(e){if(v===version)statusLine.value=e.message;}finally{if(v===version)run.disabled=false;}};
function draw(){const c=document.querySelector('canvas'),ctx=c.getContext('2d'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
c.width=w*d;c.height=h*d;ctx.scale(d,d);
predictedLayer.disabled = gpsLayer.disabled = !data;
referenceLayer.disabled = !data?.reference_route?.length;
el('reference-status').textContent = data && referenceLayer.disabled ? 'Reference unavailable' : '';
if(!data)return;
const points=data.track.concat(data.route.flat(), (data.reference_route || []).flat()),kx=Math.cos(data.track[0][1]*Math.PI/180);
let l=Infinity,r=-Infinity,b=Infinity,t=-Infinity;for(const [x,y] of points){l=Math.min(l,x*kx);r=Math.max(r,x*kx);b=Math.min(b,y);t=Math.max(t,y);}
const s=Math.min((w-32)/Math.max(r-l,1e-9),(h-32)/Math.max(t-b,1e-9)), xy=([x,y])=>[w/2+(x*kx-(l+r)/2)*s,h/2-(y-(t+b)/2)*s];
if (data.road_network) {
    const {nodes, edges} = data.road_network;
    const projected = nodes.map(xy);
    ctx.beginPath();
    for (const [from, to] of edges) {
        const [x1, y1] = projected[from], [x2, y2] = projected[to];
        if (Math.max(x1, x2) < 0 || Math.min(x1, x2) > w ||
            Math.max(y1, y2) < 0 || Math.min(y1, y2) > h) continue;
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
    }
    ctx.strokeStyle = '#84919a';
    ctx.lineWidth = 1.25;
    ctx.stroke();
}
function drawRoute(lines, color, width, dash) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash(dash);
    for (const line of lines) {
        ctx.beginPath();
        ctx.moveTo(...xy(line[0]));
        for (let i = 1; i < line.length; i++) ctx.lineTo(...xy(line[i]));
        ctx.stroke();
    }
}
if (predictedLayer.checked) drawRoute(data.route, '#17764d', 5, []);
if (referenceLayer.checked && !referenceLayer.disabled) {
    drawRoute(data.reference_route, '#c6530a', 3, [8, 6]);
}
if (gpsLayer.checked) {
    ctx.fillStyle = '#735196aa';
    for (const point of data.track) {
        const [x, y] = xy(point);
        ctx.fillRect(x-1, y-1, 2, 2);
    }
}
}
window.addEventListener('resize',draw);
</script></html>
