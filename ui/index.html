<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathSnap · Route reconstruction</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff2ef;color:#19342c;font:16px "Inter",system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:4vh 4vw}header{display:flex;align-items:baseline;gap:1em}h1{letter-spacing:-.06em;font-size:clamp(32px,5vw,64px);margin:.25em 0}form,section{background:white;border:1px solid #cad6ce;padding:18px;border-radius:8px}form{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:1em 0}label{display:grid;gap:6px}button,input,select{padding:.65em;border:1px solid #9eb3a8;border-radius:4px;font:inherit}button{background:#185d46;color:white;cursor:pointer}button:disabled{opacity:.5}canvas{display:block;width:100%;height:55vh;background:#f5f6ef}p{margin:.8em 0}.gps{color:#735196}.route{color:#17764d}output{display:block;font-variant-numeric:tabular-nums}
</style><main><header><h1>PathSnap</h1><span>Route reconstruction</span></header>
<form id="controls"><label>API address<input id="host" type="url" required></label><button type="button" id="connect">Load trips</button>
<label>Trip<select id="trips" disabled></select></label><button id="run" disabled>Reconstruct route</button></form>
<section><output id="status" aria-live="polite">Connect to the API on Laptop 1.</output><p><b class="gps">● GPS observations</b> &nbsp; <b class="route">━ Predicted road route</b></p><canvas aria-label="Map of the selected trip and predicted route"></canvas></section></main>
<script>
const el=id=>document.getElementById(id),host=el('host'),trips=el('trips'),run=el('run'),statusLine=el('status');
host.value=localStorage.getItem('api') || ('http://'+(location.hostname||'localhost')+':8000');
let data,version=0;
const base=()=>host.value.trim().replace(/\/$/,'');
function reset(){version++;data=null;draw();trips.replaceChildren();trips.disabled=run.disabled=true;}
host.oninput=reset;
el('connect').onclick=async()=>{reset();const v=version;try{
const r=await fetch(base()+'/trips');if(!r.ok)throw Error('Trip list unavailable');
const list=await r.json();if(v!==version)return;
list.forEach(t=>trips.add(new Option(t,t)));localStorage.setItem('api',base());
trips.disabled=run.disabled=!list.length;statusLine.value=list.length+' trips available.';
}catch(e){if(v===version)statusLine.value=e.message;}};
trips.onchange=()=>{version++;data=null;draw();run.disabled=false;statusLine.value='Ready.';};
el('controls').onsubmit=async e=>{e.preventDefault();const v=++version;run.disabled=true;data=null;draw();statusLine.value='Reconstructing…';
try{const r=await fetch(base()+'/predict/'+encodeURIComponent(trips.value),{method:'POST'});if(!r.ok)throw Error('Prediction failed ('+r.status+')');
const next=await r.json();if(v!==version)return;data=next;draw();
statusLine.value='Trip '+data.trip+' · '+data.track.length+' observations · '+data.route.length+' route fragments · '+data.elapsed_seconds.toFixed(2)+' s'+(data.metrics?' · Top-1 '+(100*data.metrics.top1).toFixed(2)+'%':'');
}catch(e){if(v===version)statusLine.value=e.message;}finally{if(v===version)run.disabled=false;}};
function draw(){const c=document.querySelector('canvas'),ctx=c.getContext('2d'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
c.width=w*d;c.height=h*d;ctx.scale(d,d);if(!data)return;
const points=data.track.concat(data.route.flat()),kx=Math.cos(data.track[0][1]*Math.PI/180);
let l=Infinity,r=-Infinity,b=Infinity,t=-Infinity;for(const [x,y] of points){l=Math.min(l,x*kx);r=Math.max(r,x*kx);b=Math.min(b,y);t=Math.max(t,y);}
const s=Math.min((w-32)/Math.max(r-l,1e-9),(h-32)/Math.max(t-b,1e-9)), xy=([x,y])=>[w/2+(x*kx-(l+r)/2)*s,h/2-(y-(t+b)/2)*s];
ctx.strokeStyle='#17764d';ctx.lineWidth=3;for(const segment of data.route){ctx.beginPath();segment.forEach((p,i)=>{const q=xy(p);if(i)ctx.lineTo(...q);else ctx.moveTo(...q);});ctx.stroke();}
ctx.fillStyle='#735196aa';for(const p of data.track){const [x,y]=xy(p);ctx.fillRect(x-1,y-1,2,2);}}
window.addEventListener('resize',draw);
</script></html>
